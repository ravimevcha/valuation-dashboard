<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity Valuation Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --panel2:#fbfaf7; --ink:#1b1d21; --ink2:#4a4f58; --ink3:#868b94; --line:#e4e2dc; --line2:#efede8;
  --accent:#1f4fd6; --accent-soft:#e8eefc;
  --buy:#1d7a46; --buy-soft:#e3f3e9; --watch:#9a6a00; --watch-soft:#fbf1d8; --avoid:#b4322a; --avoid-soft:#fbe6e3; --reduce:#b85c12; --reduce-soft:#fcebdc;
  --dcf:#3b6fd4; --emv:#8a5cc7; --sotp:#1c9a8a; --blend:#1b1d21;
  --price:#d33a2c; --buyline:#1d7a46;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 4px 16px rgba(20,20,30,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --panel:#181b20; --panel2:#1d2026; --ink:#eceef1; --ink2:#b4b9c2; --ink3:#7d838d; --line:#2a2e35; --line2:#22262c;
  --accent:#7aa2ff; --accent-soft:#1f2a44;
  --buy:#4cc985; --buy-soft:#15301f; --watch:#e8b84a; --watch-soft:#33290f; --avoid:#ff7b6e; --avoid-soft:#3a1a17; --reduce:#f4a05a; --reduce-soft:#3a2513;
  --dcf:#6f9bff; --emv:#b78cf0; --sotp:#4fd1bf; --blend:#eceef1; --price:#ff6b5c; --buyline:#4cc985; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#181b20; --panel2:#1d2026; --ink:#eceef1; --ink2:#b4b9c2; --ink3:#7d838d; --line:#2a2e35; --line2:#22262c;
  --accent:#7aa2ff; --accent-soft:#1f2a44;
  --buy:#4cc985; --buy-soft:#15301f; --watch:#e8b84a; --watch-soft:#33290f; --avoid:#ff7b6e; --avoid-soft:#3a1a17; --reduce:#f4a05a; --reduce-soft:#3a2513;
  --dcf:#6f9bff; --emv:#b78cf0; --sotp:#4fd1bf; --blend:#eceef1; --price:#ff6b5c; --buyline:#4cc985; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
.num,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:24px 20px 60px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--ink3)}
.kpi.on{outline:2px solid var(--accent);outline-offset:-1px}
.kpi .l{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .v{font-size:24px;font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--ink3)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;box-shadow:var(--shadow)}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:13px}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;padding:0 4px}
.count{color:var(--ink3);font-size:12.5px;margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:600;background:var(--panel2);position:sticky;top:0;cursor:pointer}
th.r,td.r{text-align:right}
th:hover{color:var(--ink)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
.cname{font-weight:600;color:var(--ink);text-decoration:none}
.cname:hover{color:var(--accent)}
.meta{font-size:12px;color:var(--ink3)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.r-BUY{background:var(--buy-soft);color:var(--buy)}
.r-WATCH{background:var(--watch-soft);color:var(--watch)}
.r-AVOID,.r-SELL,.r-STRONG{background:var(--avoid-soft);color:var(--avoid)}
.r-REDUCE{background:var(--reduce-soft);color:var(--reduce)}
.hv{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid}
.hv-att{color:var(--buy);border-color:var(--buy)}
.hv-acc{color:var(--accent);border-color:var(--accent)}
.hv-mkt{color:var(--watch);border-color:var(--watch)}
.hv-un{color:var(--avoid);border-color:var(--avoid)}
.hv-na{color:var(--ink3);border-color:var(--line);font-weight:500}
.tag{font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:6px;vertical-align:1px}
.tag.old{background:var(--line2);color:var(--ink3)}
.pos{color:var(--buy)}.neg{color:var(--avoid)}
.mini{display:block}
.empty{padding:40px;text-align:center;color:var(--ink3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin:10px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.insight h3{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.insight{padding:14px 16px}
.insight ol{margin:0;padding-left:18px}
.insight li{margin:4px 0}
.insight li a{text-decoration:none;font-weight:500}
.insight li a:hover{color:var(--accent)}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);text-decoration:none;font-size:13px;margin-bottom:14px}
.back:hover{color:var(--accent)}
.dhead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.dhead h1{font-size:26px}
.dpills{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.dpills .pill{font-size:12.5px;padding:3px 10px}
.dpills .hv{font-size:12px;padding:3px 9px}
.navs{display:flex;gap:6px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{padding:12px 14px}
.stat .l{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-size:22px;font-weight:600;margin-top:2px}
.stat .s{font-size:12.5px;color:var(--ink3)}
.sec{padding:16px 18px;margin-top:12px}
.sec h2{font-size:15px;margin:0 0 2px}
.sec .h2s{font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.vt td,.vt th{padding:8px 10px}
.vt th{cursor:default;position:static}
.vt tbody tr{cursor:default}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.hzgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.hzk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hzk .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.hzk .box .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.hzk .box .v{font-size:18px;font-weight:600}
.hzk .box .s{font-size:12px;color:var(--ink3)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink2);margin-top:12px}
.callout.warn{border-color:var(--watch);background:var(--watch-soft)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--ink3)}
svg text{font-family:"IBM Plex Mono",ui-monospace,monospace}
.foot{color:var(--ink3);font-size:12px;margin-top:24px}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.hzgrid,.grid2{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:16px 16px 40px}.kpis{grid-template-columns:repeat(2,1fr)}.kv{grid-template-columns:1fr}.count{margin-left:0}}
</style>
</head>

/* ---------- mini range bar ---------- */
function miniBar(c){
  const [b,m,u]=c.bl; const w=104,h=22;
  if(!isNum(b)||!isNum(u)) return `<span class="meta">range n/a</span>`;
  const lo=Math.min(b,c.cmp,isNum(c.buy)?c.buy:b)*0.92, hi=Math.max(u,c.cmp)*1.05;
  const x=v=>4+(v-lo)/(hi-lo)*(w-8);
  return `<svg class="mini" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Blended range vs price">
   <line x1="4" x2="${w-4}" y1="11" y2="11" stroke="var(--line)" stroke-width="1"/>

  </svg>`;
}

  $("#fh").onchange=e=>{state.hv=e.target.value;save();listView();};
  $("#ff").onchange=e=>{state.fmt=e.target.value;save();listView();};
  $("#hz").onchange=e=>{state.hzOnly=e.target.checked;save();listView();};
  $("#kHz").onclick=()=>{state.hzOnly=!state.hzOnly;save();listView();};
  $("#kBelow").onclick=()=>{state.below=!state.below;save();listView();};
  $("#kAll").onclick=()=>{Object.assign(state,{q:"",rating:"",hv:"",hzOnly:false,fmt:"",below:false});save();listView();};
  document.querySelectorAll(".kpi[data-r]").forEach(k=>k.onclick=()=>{state.rating=state.rating===k.dataset.r?"":k.dataset.r;save();listView();});
  document.querySelectorAll("th[data-s]").forEach(t=>t.onclick=()=>{const k=t.dataset.s; if(state.sort===k) state.dir*=-1; else {state.sort=k; state.dir=(k==="name"||k==="rating"||k==="hv")?1:-1;} save(); listView();});
  document.querySelectorAll("tbody tr[data-id]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("a")) return; location.hash="#/c/"+tr.dataset.id;});
  $("#theme").onclick=toggleTheme;
  const clr=$("#clr"); if(clr) clr.onclick=e=>{e.preventDefault(); $("#kAll").click();};
}

/* ---------- football field ---------- */
function football(c){
  const M=[["DCF","dcf","var(--dcf)"],["Earnings Multiplier","emv","var(--emv)"],["SOTP","sotp","var(--sotp)"],["Blended","bl","var(--blend)"]];
  const rows=M.filter(([,k])=>c[k].some(isNum));
  if(!rows.length) return `<div class="empty">No method values in this report.</div>`;
  const vals=[c.cmp,c.buy,...rows.flatMap(([,k])=>c[k])].filter(isNum);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.08||hi*0.1; lo=Math.min(lo-pad, lo<0?lo-pad:Math.max(0,lo-pad)); hi+=pad;
  const AW=document.querySelector('#app').clientWidth-40; const W=Math.max(330,Math.min(900,AW)), L=W<600?96:150, R=W<600?40:30, rowH=54, T=34, H=T+rows.length*rowH+30;
  const x=v=>L+(v-lo)/(hi-lo)*(W-L-R);
  const ticks=[]; const step=niceStep((hi-lo)/6); for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) ticks.push(t);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Valuation range by method">`;
  ticks.forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${T-8}" y2="${H-26}" stroke="var(--line2)"/><text x="${x(t)}" y="${H-8}" font-size="11" fill="var(--ink3)" text-anchor="middle">${fmt(t)}</text>`;});
  rows.forEach(([lab,k,col],i)=>{
    const [b,m,u]=c[k]; const y=T+i*rowH+rowH/2; const bold=k==="bl";
    s+=`<text x="0" y="${y+4}" font-size="${W<600?11.5:13}" font-weight="${bold?700:500}" fill="var(--ink)" style="font-family:'IBM Plex Sans',system-ui,sans-serif">${W<600&&lab==="Earnings Multiplier"?"Earnings Mult.":lab}</text>`;
    if(isNum(b)&&isNum(u)){
      s+=`<rect x="${x(b)}" y="${y-10}" width="${Math.max(3,x(u)-x(b))}" height="20" rx="4" fill="${col}" opacity="${bold?.85:.28}"/>`;
      s+=`<text x="${x(b)-6}" y="${y+4}" font-size="11" fill="var(--ink2)" text-anchor="end">${fmt(b)}</text><text x="${x(u)+6}" y="${y+4}" font-size="11" fill="var(--ink2)">${fmt(u)}</text>`;
    }
    if(isNum(m)){ s+=`<rect x="${x(m)-2}" y="${y-14}" width="4" height="28" rx="1" fill="${bold?'var(--panel)':col}" stroke="${bold?'var(--blend)':'none'}" stroke-width="1.5"/>
      <text x="${x(m)}" y="${y-18}" font-size="11.5" font-weight="600" fill="${col==='var(--blend)'?'var(--ink)':col}" text-anchor="middle">${fmt(m)}</text>`;}
    if(!isNum(b)&&!isNum(u)&&!isNum(m)) s+=`<text x="${L}" y="${y+4}" font-size="11" fill="var(--ink3)">not given</text>`;
  });
  const near = isNum(c.buy) && Math.abs(x(c.buy)-x(c.cmp))<120;
  const anc=(v,other)=> !near ? "middle" : (v<other?"end":"start");
  const dx=(v,other)=> !near ? 0 : (v<other?-4:4);
  const vline=(v,col,lab,dash,other)=>{ if(!isNum(v)) return ""; return `<line x1="${x(v)}" x2="${x(v)}" y1="${T-12}" y2="${H-26}" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="5 4"':''}/>
    <text x="${x(v)+dx(v,other)}" y="${T-16}" font-size="11.5" font-weight="600" fill="${col}" text-anchor="${anc(v,other)}" style="font-family:'IBM Plex Sans',system-ui,sans-serif">${lab} ${fmt(v)}</text>`;};
  s+=vline(c.buy,"var(--buyline)","Buy-below",true,c.cmp);
  s+=vline(c.cmp,"var(--price)","Price",false,c.buy);
  s+=`</svg>`;
  return s;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }

/* ---------- horizon path ---------- */
function pathChart(c){
  const pts=[["Today",c.cmp]]; if(isNum(c.b3)) pts.push(["Base ~3Y",c.b3]); if(isNum(c.b5)) pts.push(["Base ~5Y",c.b5]);
  const W=Math.max(320,Math.min(520,document.querySelector('#app').clientWidth-40)),H=230,L=56,R=24,T=24,B=36;
  const vals=[c.cmp,c.b3,c.b5,c.u5,c.buy,c.bl[1]].filter(isNum); let lo=Math.min(...vals)*0.85, hi=Math.max(...vals)*1.06;
  const xs=[L, L+(W-L-R)*0.6, W-R]; const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const xi=i=> pts.length===3?xs[i]:(i===0?L:W-R);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Horizon price path">`;
  const step=niceStep((hi-lo)/4); for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line2)"/><text x="${L-8}" y="${y(t)+4}" font-size="10.5" fill="var(--ink3)" text-anchor="end">${fmt(t)}</text>`;
  if(isNum(c.buy)) s+=`<line x1="${L}" x2="${W-R}" y1="${y(c.buy)}" y2="${y(c.buy)}" stroke="var(--buyline)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(c.buy)-6}" font-size="11" fill="var(--buyline)" text-anchor="end" style="font-family:'IBM Plex Sans',system-ui,sans-serif">Buy-below ${fmt(c.buy)}</text>`;
  if(isNum(c.u5)) s+=`<line x1="${xi(0)}" y1="${y(c.cmp)}" x2="${W-R}" y2="${y(c.u5)}" stroke="var(--buy)" stroke-width="2" stroke-dasharray="2 4"/><circle cx="${W-R}" cy="${y(c.u5)}" r="5" fill="var(--buy)"/><text x="${W-R-8}" y="${y(c.u5)-9}" font-size="11.5" font-weight="600" fill="var(--buy)" text-anchor="end">Bull ${fmt(c.u5)}</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((p,i)=>xi(i)+","+y(p[1])).join(" ")}"/>`;
  pts.forEach((p,i)=>{ s+=`<circle cx="${xi(i)}" cy="${y(p[1])}" r="5" fill="${i?'var(--accent)':'var(--price)'}" stroke="var(--panel)" stroke-width="2"/>
    <text x="${xi(i)}" y="${y(p[1])+ (i? 20:-10)}" font-size="11.5" font-weight="600" fill="${i?'var(--accent)':'var(--price)'}" text-anchor="${i===0?'start':'middle'}">${fmt(p[1])}</text>
    <text x="${xi(i)}" y="${H-12}" font-size="11" fill="var(--ink3)" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" style="font-family:'IBM Plex Sans',system-ui,sans-serif">${p[0]}</text>`; });
  return s+"</svg>";
}
const HV_TEXT={
 "ATTRACTIVE FOR 3-5Y HOLDING":"Base-case returns clear the 15% hurdle from today's price.",
 "ACCUMULATE / HOLD FOR HORIZON":"Base-case returns beat the 12% cost of equity but fall short of the 15% hurdle — accumulate on dips, toward the buy-below price.",
 "MARKET-LIKE RETURNS":"Base-case returns sit below the 12% cost of equity — roughly market-like, with no reward for the risk at today's price.",
 "UNATTRACTIVE EVEN OVER 3-5Y":"Even a patient 3-5 year holder earns low single-digit returns in the Base case at today's price."};

/* ---------- detail view ---------- */
function detailView(id){
  const c=DATA.find(d=>d.id===id); if(!c){ location.hash=""; return; }
  const order=filtered(); const idx=order.findIndex(d=>d.id===id);
  const prev=order[idx-1], next=order[idx+1];
  const M=[["DCF","dcf","var(--dcf)"],["Earnings Multiplier","emv","var(--emv)"],["SOTP","sotp","var(--sotp)"],["Blended","bl","var(--blend)"]];
  const bases=["dcf","emv","sotp"].map(k=>c[k][1]).filter(isNum);
  let agree="";
  if(bases.length>=2){ const mn=Math.min(...bases), mx=Math.max(...bases); const r=mx/mn; agree = mn>0 ? `Base values across methods span ${rs(mn)}–${rs(mx)} (${r.toFixed(2)}x). ${r<1.25?"The methods broadly agree.":r<1.7?"The methods diverge moderately.":"The methods diverge sharply — read the note on weighting."}` : ""; }
  const vrow=([lab,k,col])=>{const v=c[k]; if(!v.some(isNum)) return `<tr><td><span class="dot" style="background:${col}"></span>${lab}</td><td colspan="6" class="meta">Not given in this report</td></tr>`;
    return `<tr${k==="bl"?' style="font-weight:600"':''}><td><span class="dot" style="background:${col}"></span>${lab}</td>${v.map(x=>`<td class="r num">${rs(x)}</td>`).join("")}${v.map(x=>`<td class="r num">${isNum(x)?pctc(x/c.cmp-1):'<span class="meta">—</span>'}</td>`).join("")}</tr>`;};
  const hz = c.hv ? `
   <div class="card sec"><h2>3-5 Year Horizon View</h2><div class="h2s">${esc(c.hnote||"")} · total-return CAGRs include dividends · hurdle 15% p.a., cost of equity 12%</div>
    <div class="hzgrid"><div>${pathChart(c)}</div>
     <div><div style="margin-bottom:10px">${hvPill(c.hv,true)}</div>
      <div class="hzk">
       <div class="box"><div class="l">Base price ~3Y</div><div class="v num">${rs(c.b3)}</div><div class="s">TR CAGR ${pct(c.b3c)}</div></div>
       <div class="box"><div class="l">Base price ~5Y</div><div class="v num">${rs(c.b5)}</div><div class="s">TR CAGR ${pct(c.b5c)}</div></div>
       <div class="box"><div class="l">Bull price ~5Y</div><div class="v num">${rs(c.u5)}</div><div class="s">TR CAGR ${pct(c.u5c)}</div></div>
       <div class="box"><div class="l">Buy-below (15% hurdle)</div><div class="v num">${rs(c.buy)}</div><div class="s">${isNum(c.buyp)?"prob-wtd "+rs(c.buyp)+" · ":""}${pct(c.buyGap,0)} vs price</div></div>
      </div>
      <div class="callout"><b>Bull fair value reached in:</b> ${esc(c.reach||"—")}</div>
      <div class="callout warn">${esc(HV_TEXT[c.hv]||"")}</div>
     </div></div></div>`
   : `<div class="card sec"><h2>3-5 Year Horizon View</h2><div class="meta">This report predates the horizon-view format, so there is no 3-5 year price path. Re-running the report with the current process would add it.</div></div>`;
  $("#app").innerHTML = `
   <a class="back" href="#">← All companies</a>
   <div class="dhead"><div><h1>${esc(c.name)}</h1>
     <div class="sub">Report dated ${esc(c.rd)} · price as of ${esc(c.pd && c.pd!=="n/a"?c.pd:c.rd)} · ${esc(c.file)}</div>
     <div class="dpills">${ratingPill(c.rating)} ${hvPill(c.hv,true)} ${c.status?`<span class="tag" style="margin:0">${esc(c.status)}</span>`:""} ${c.old?`<span class="tag old" style="margin:0">older report format</span>`:""}</div></div>
    <div class="navs"><button class="btn" ${prev?`onclick="location.hash='#/c/${prev.id}'"`:"disabled"}>← Prev</button><button class="btn" ${next?`onclick="location.hash='#/c/${next.id}'"`:"disabled"}>Next →</button><button class="btn" id="theme">Theme</button></div></div>
   <div class="stats">
    <div class="card stat"><div class="l">Price on report date</div><div class="v num">${rs(c.cmp)}</div><div class="s">${esc(c.pd && c.pd!=="n/a"?c.pd:c.rd)}</div></div>
    <div class="card stat"><div class="l">Blended Base</div><div class="v num">${rs(c.bl[1])}</div><div class="s">${isNum(c.up)?pctc(c.up)+" vs price":"not given as a single value"}</div></div>
    <div class="card stat"><div class="l">Blended range</div><div class="v num" style="font-size:18px">${isNum(c.bl[0])?rs(c.bl[0])+" – "+rs(c.bl[2]):"—"}</div><div class="s">${c.old?"low – high across methods":"Bear – Bull"}</div></div>
    <div class="card stat"><div class="l">Bear downside</div><div class="v num">${isNum(c.bl[0])?pctc(c.bl[0]/c.cmp-1):"—"}</div><div class="s">Bull: ${isNum(c.bl[2])?pctc(c.bl[2]/c.cmp-1):"—"}</div></div>
    <div class="card stat"><div class="l">Methods in report</div><div class="v num">${c.methods}</div><div class="s">${["DCF","EMV","SOTP"].filter((_,i)=>isNum(c[["dcf","emv","sotp"][i]][1])).join(" · ")||"central value only"}</div></div>
   </div>
   <div class="card sec"><h2>Valuation by method</h2><div class="h2s">Bars run Bear → Bull; the tick is Base. Red line = price on report date; green dashed = buy-below price.</div>
    ${football(c)}
    <div class="legend"><span><i style="background:var(--dcf)"></i>DCF</span><span><i style="background:var(--emv)"></i>Earnings Multiplier</span><span><i style="background:var(--sotp)"></i>SOTP</span><span><i style="background:var(--blend)"></i>Blended</span></div>
   </div>
   <div class="card sec"><h2>Valuation table</h2><div class="h2s">${agree||"Per-share fair values (₹) and implied move from the report-date price."}</div>
    <div class="tablewrap"><table class="vt"><thead><tr><th>Method</th><th class="r">Bear</th><th class="r">Base</th><th class="r">Bull</th><th class="r">Bear vs price</th><th class="r">Base vs price</th><th class="r">Bull vs price</th></tr></thead>
    <tbody>${M.map(vrow).join("")}</tbody></table></div>
    ${c.note?`<div class="callout ${c.old||/range only|only/i.test(c.note)?'warn':''}"><b>Report note:</b> ${esc(c.note)}</div>`:""}
   </div>
   ${hz}
   <div class="card sec"><h2>Report details</h2><div class="kv" style="margin-top:8px">
    <div>Report file</div><div>${esc(c.file)}</div><div>Report date</div><div>${esc(c.rd)}</div><div>Recommendation</div><div>${esc(c.rating)}</div>
    <div>Horizon view</div><div>${esc(c.hv||"Not in report")}</div><div>Update status</div><div>${esc(c.status||"Unchanged since 12-Oct file")}</div></div></div>
   <div class="foot">Values per share in ₹ as stated in the report. Not investment advice.</div>`;
  $("#theme").onclick=toggleTheme; window.scrollTo(0,0);
}
function toggleTheme(){ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; try{localStorage.setItem("vd_theme",r.dataset.theme);}catch(e){} }
try{ const t=localStorage.getItem("vd_theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
function route(){ const m=/#\/c\/(\d+)/.exec(location.hash); if(m) detailView(+m[1]); else listView(); }
addEventListener("hashchange",route); let rz; addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{ if(location.hash.startsWith('#/c/')) route(); },150);}); route();
</script>
